server:
  port: 8083

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce_order?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_local_pass}


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  kafka:
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096

    consumer:
      group-id: order-stock-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false

logging:
  file:
    name: logs/order-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
  level:
    root: INFO
    br.com.ecommerce.order: INFO

outbox:
  publisher:
    enabled: true
    fixed-delay-ms: 3000

# Observabilidade (ambiente local): scrape Prometheus e traces OTLP via HTTP
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
